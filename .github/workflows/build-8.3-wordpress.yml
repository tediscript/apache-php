name: Build 8.3-wordpress and Push to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - '8.3-wordpress/**'
      - '.github/workflows/build-8.3-wordpress.yml'
  pull_request:
    paths:
      - '8.3-wordpress/**'
      - '.github/workflows/build-8.3-wordpress.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate build timestamp (UTC)
        id: ts
        run: echo "date=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build test candidate (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: 8.3-wordpress
          platforms: linux/amd64
          push: false
          load: true
          tags: apache-php:8.3-wordpress-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run verification suite (gate)
        run: bash 8.3-wordpress/test.sh apache-php:8.3-wordpress-candidate --no-build

      - name: Push to Docker Hub (only if tests passed)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: 8.3-wordpress
          platforms: linux/amd64
          push: true
          tags: |
            tediscript/apache-php:8.3-wordpress
            tediscript/apache-php:8.3-wordpress-${{ steps.ts.outputs.date }}
          cache-from: type=gha

      - name: Post build cleanup
        run: docker builder prune --force
