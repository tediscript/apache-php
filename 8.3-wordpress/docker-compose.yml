---

services:
  php83:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - 80:80
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./info.php:/var/www/html/index.php
      # Edit these files and `docker compose restart php83` to apply -- no rebuild needed.
      # NOTE: mount individual files only; mounting a whole directory over
      # /usr/local/etc/php/conf.d would hide the extension ini files (apcu, redis, ...)
      - ./zz-wordpress.ini:/usr/local/etc/php/conf.d/zz-wordpress.ini:ro
      - ./zz-opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
      - ./zz-logging.ini:/usr/local/etc/php/conf.d/zz-logging.ini:ro
      # - ./000-default.conf:/etc/apache2/sites-available/000-default.conf
      # - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini
      # - ./log:/var/log/apache2
      # - ./html:/var/www/html
      # - ./example.com:/var/www/example.com
  
    
